services:
  db:
    image: postgres:17
    container_name: sport-class-booking-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: sport_class_booking_db
      POSTGRES_USER: ${DB_USER:-user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-qwerty}

    ports:
      - "5433:5432"

    volumes:
      - pgdata:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-user} -d sport_class_booking_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8.4
    container_name: sport-class-booking-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:-qwerty}
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-qwerty}
    volumes:
      - redis-data:/data

  adminer:
    image: adminer
    restart: unless-stopped
    ports:
      - '1234:8080'
    depends_on:
      - db

  sonar-db:
    image: postgres:17
    container_name: sport-class-booking-sonar-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: sonarqube
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
    volumes:
      - sonar-pgdata:/var/lib/postgresql/data

  sonarqube:
    image: sonarqube:community
    container_name: sport-class-booking-sonar
    restart: unless-stopped
    depends_on:
      - sonar-db
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonarqube
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    ports:
      - "9000:9000"
    volumes:
      - sonarqube-data:/opt/sonarqube/data
      - sonarqube-extensions:/opt/sonarqube/extensions
      - sonarqube-logs:/opt/sonarqube/logs

volumes:
  pgdata:
  redis-data:
  sonar-pgdata:
  sonarqube-data:
  sonarqube-extensions:
  sonarqube-logs: