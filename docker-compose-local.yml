services:
  db:
    image: postgres:17
    container_name: sport-class-booking-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: sport_class_booking_db
      POSTGRES_USER: ${DB_USER:-user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-qwerty}

    ports:
      - "5433:5432"

    volumes:
      - pgdata:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-user} -d sport_class_booking_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8.4
    container_name: sport-class-booking-redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:-qwerty}
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-qwerty}
    volumes:
      - redis-data:/data

  adminer:
    image: adminer
    ports:
      - '1234:8080'
    depends_on:
      - db


volumes:
  pgdata:
  redis-data: