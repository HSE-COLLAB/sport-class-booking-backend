services:
  db:
    image: postgres:17
    container_name: sport-class-booking-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: sport_class_booking_db
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    volumes:
      - pgdata:/var/lib/postgresql/data

    ports:
      - "5433:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d sport_class_booking_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8.4
    container_name: sport-class-booking-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD}
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    volumes:
      - redis-data:/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sport-class-booking-backend
    restart: unless-stopped

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

    environment:
      SPRING_PROFILES_ACTIVE: stand
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_URL: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MILLIS: ${JWT_EXPIRATION_MILLIS}
      REFRESH_EXPIRATION_MILLIS: ${REFRESH_EXPIRATION_MILLIS}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM: ${MAIL_FROM}
      APP_BASE_URL: ${APP_BASE_URL}

    ports:
      - "8080:8080"

volumes:
  pgdata:
  redis-data: